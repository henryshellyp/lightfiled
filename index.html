<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交互式粒子光场 · Interactive Particle Light Field</title>
<style>
  /* ---------- 基础布局：整屏画布，无滚动 ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #05060d; overflow: hidden; }
  body {
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color: #dfe7f5;
    -webkit-user-select: none;
    user-select: none;
  }
  #field {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;        /* 允许触屏拖动，不触发页面滚动 */
    cursor: crosshair;
  }

  /* ---------- 悬浮 HUD ---------- */
  .hud {
    position: fixed;
    z-index: 10;
    background: rgba(8, 12, 22, .55);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px;
    padding: 8px 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events: none;      /* 不挡住画布上的鼠标交互 */
  }
  #hint   { top: 14px; left: 14px; max-width: calc(100vw - 28px); }
  #stats  { top: 14px; right: 14px; text-align: right; min-width: 132px; }
  #controls {
    bottom: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;      /* 滑杆需要可交互 */
  }
  #controls input[type="range"] { width: 190px; accent-color: #7fd7ff; }
  .k    { color: #7fd7ff; }
  .dim  { color: #8b97ad; }
  #stats b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #pause {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    letter-spacing: .35em;
    color: rgba(255, 255, 255, .72);
    pointer-events: none;
  }
  #pause.on { display: flex; }
</style>
</head>
<body>

<canvas id="field"></canvas>

<div id="hint" class="hud">
  移动<span class="k">吸引</span> · 按住<span class="k">排斥</span> · 单击<span class="k">冲击波</span>
  · <span class="k">空格</span>换配色 · <span class="k">R</span>重置 · <span class="k">P</span>暂停 · <span class="k">S</span>存PNG
</div>

<div id="stats" class="hud">
  <div><span class="dim">FPS   </span><b id="fps">--</b></div>
  <div><span class="dim">粒子  </span><b id="count">--</b></div>
  <div class="dim" id="seedLabel" title="在地址栏加 ?seed=xxx 可复现初始画面">seed: --</div>
</div>

<div id="controls" class="hud">
  <span class="dim">粒子上限</span>
  <input id="countSlider" type="range" min="200" max="4000" step="50" value="1500">
  <b id="sliderVal">1500</b>
</div>

<div id="pause">已 暂 停</div>

<script>
"use strict";
/* =========================================================================
   交互式粒子光场 —— 纯 Canvas 2D，无外部依赖
   结构：
     1) 配置与配色        2) 可复现随机数       3) 状态与画布
     4) 发光精灵预渲染     5) 粒子/冲击波        6) 输入事件
     7) 物理更新与绘制     8) 帧循环 / FPS / 自适应降级 / 导出
   ========================================================================= */

/* ---------------- 1. 配置与配色 ---------------- */
const TAU = Math.PI * 2;
const CFG = {
  MAX: 4000, MIN: 200,              // 粒子数组容量、自适应下限
  SOFT: 600,                        // 引力软化项，避免距离趋零时力爆炸
  INFLUENCE: 260000,                // 力场影响范围尺度（对距离平方归一化）
  ATTRACT: 0.22,                    // 吸引强度
  REPEL: 0.70,                      // 排斥强度（按住鼠标）
  SWIRL: 0.09,                      // 切向旋涡力，让粒子绕光标旋转而非硬聚成一点
  DAMPING: 0.965,                   // 每帧阻尼（惯性衰减）
  JITTER: 0.06,                     // 微小随机扰动，保持画面"活着"
  SPEED_REF: 5.5,                   // 速度 → 冷暖色的映射参考值
  FADE: 0.14,                       // 每帧背景覆盖率，越小拖尾越长
  SHOCK_SPEED: 16,                  // 冲击波扩散速度 px/帧
  SHOCK_FORCE: 2.2,                 // 冲击波推力
  SHOCK_BAND: 46,                   // 冲击波作用带宽
  SPRITE_STEPS: 32,                 // 冷暖色采样档数（预渲染精灵数量）
  SPRITE_SIZE: 32                   // 单个发光精灵尺寸
};

// 三套配色：cool = 低速冷色，warm = 高速暖色，bg = 背景色
const PALETTES = [
  { name: "极光", cool: [40, 220, 255],  warm: [255, 90, 200], bg: [4, 8, 20]  },
  { name: "熔金", cool: [60, 130, 255],  warm: [255, 165, 55], bg: [9, 6, 16]  },
  { name: "霓虹", cool: [110, 255, 150], warm: [200, 100, 255], bg: [4, 12, 17] }
];

/* ---------------- 2. 可复现随机数（mulberry32） ---------------- */
function hashSeed(str) {                       // 把任意字符串种子转成 uint32
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a) {                       // 32 位高质量 PRNG
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const params   = new URLSearchParams(location.search);
const seedText = params.get("seed");
let   baseSeed, rand;
if (seedText !== null) {
  baseSeed = hashSeed(seedText);
} else {
  baseSeed = (Math.random() * 4294967296) >>> 0;
  // 把自动生成的种子写回地址栏，方便直接复制链接复现
  try {
    const u = new URL(location.href);
    u.searchParams.set("seed", String(baseSeed));
    history.replaceState(null, "", u.toString());
  } catch (_) { /* file:// 下部分浏览器禁止 replaceState，忽略即可 */ }
}
document.getElementById("seedLabel").textContent = "seed: " + (seedText || baseSeed);

/* ---------------- 3. 状态与画布 ---------------- */
const canvas = document.getElementById("field");
const ctx    = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, dpr = 1;

// 粒子使用 SoA（结构数组）+ Float32Array：缓存友好、无 GC 压力
const px = new Float32Array(CFG.MAX);
const py = new Float32Array(CFG.MAX);
const vx = new Float32Array(CFG.MAX);
const vy = new Float32Array(CFG.MAX);

let desired = 1500;        // 滑杆设定的目标上限
let activeCount = 1500;    // 实际渲染数量，掉帧时自动下调
let paused = false;

const shocks = [];         // 冲击波列表 {x, y, r}

const pointer = { x: -9999, y: -9999, lx: -9999, ly: -9999, active: false, down: false, energy: 0 };

// 当前配色（用于平滑过渡）
const cur = {
  cool: PALETTES[0].cool.slice(),
  warm: PALETTES[0].warm.slice(),
  bg:   PALETTES[0].bg.slice()
};
let targetIndex = 0;
let transitioning = false;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);   // 限制 DPR，兼顾清晰度与性能
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);            // 之后所有坐标都用 CSS 像素
  clearOpaque();
}
function clearOpaque() {
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgb(${cur.bg[0] | 0},${cur.bg[1] | 0},${cur.bg[2] | 0})`;
  ctx.fillRect(0, 0, W, H);
}

/* ---------------- 4. 发光精灵预渲染 ----------------
   把 32 档「冷 → 暖」的径向渐变预先画到一条精灵带上，
   每帧只需 drawImage 取对应档位，比逐粒子创建渐变/shadowBlur 快得多。 */
const strip = document.createElement("canvas");
const SS = CFG.SPRITE_SIZE, HS = SS / 2;
strip.width = CFG.SPRITE_STEPS * SS;
strip.height = SS;
const sctx = strip.getContext("2d");

function buildSprites() {
  sctx.clearRect(0, 0, strip.width, strip.height);
  for (let i = 0; i < CFG.SPRITE_STEPS; i++) {
    const t = i / (CFG.SPRITE_STEPS - 1);
    const r = Math.round(cur.cool[0] + (cur.warm[0] - cur.cool[0]) * t);
    const g = Math.round(cur.cool[1] + (cur.warm[1] - cur.cool[1]) * t);
    const b = Math.round(cur.cool[2] + (cur.warm[2] - cur.cool[2]) * t);
    const ox = i * SS;
    const grad = sctx.createRadialGradient(ox + HS, HS, 0, ox + HS, HS, HS);
    grad.addColorStop(0,    "rgba(255,255,255,0.95)");           // 炽白核心
    grad.addColorStop(0.16, `rgba(${r},${g},${b},0.85)`);
    grad.addColorStop(0.42, `rgba(${r},${g},${b},0.26)`);
    grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
    sctx.fillStyle = grad;
    sctx.fillRect(ox, 0, SS, SS);
  }
}

function paletteTick() {
  if (!transitioning) return;
  let maxDiff = 0;
  const target = PALETTES[targetIndex];
  for (const key of ["cool", "warm", "bg"]) {
    for (let c = 0; c < 3; c++) {
      const d = target[key][c] - cur[key][c];
      cur[key][c] += d * 0.07;                  // 指数缓动
      maxDiff = Math.max(maxDiff, Math.abs(d));
    }
  }
  buildSprites();
  if (maxDiff < 0.6) {                          // 收敛后精确吸附并停止重建
    for (const key of ["cool", "warm", "bg"])
      for (let c = 0; c < 3; c++) cur[key][c] = target[key][c];
    buildSprites();
    transitioning = false;
  }
}

/* ---------------- 5. 粒子 / 冲击波 ---------------- */
function initParticles() {
  rand = mulberry32(baseSeed);                  // R 重置：重新播种，画面可复现
  for (let i = 0; i < CFG.MAX; i++) {
    px[i] = rand() * W;
    py[i] = rand() * H;
    const a = rand() * TAU, sp = 0.2 + rand() * 1.2;
    vx[i] = Math.cos(a) * sp;
    vy[i] = Math.sin(a) * sp;
  }
  shocks.length = 0;
  clearOpaque();
}
function spawnShock(x, y) { shocks.push({ x, y, r: 0 }); }

function updateWaves(dt) {
  const maxR = Math.hypot(W, H) * 1.2;
  for (let i = shocks.length - 1; i >= 0; i--) {
    shocks[i].r += CFG.SHOCK_SPEED * dt;
    if (shocks[i].r > maxR) shocks.splice(i, 1);
  }
}

/* ---------------- 6. 输入事件 ---------------- */
function setPointer(e) {
  const dx = e.clientX - pointer.lx, dy = e.clientY - pointer.ly;
  pointer.energy = Math.min(1, pointer.energy + Math.hypot(dx, dy) / 60); // 移动越快吸引越强
  pointer.lx = e.clientX; pointer.ly = e.clientY;
  pointer.x = e.clientX;  pointer.y = e.clientY;
  pointer.active = true;
}
canvas.addEventListener("pointermove", setPointer);
canvas.addEventListener("pointerdown", (e) => {
  setPointer(e);
  pointer.down = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  spawnShock(e.clientX, e.clientY);              // 点击 = 一次冲击波
});
canvas.addEventListener("pointerup",     () => { pointer.down = false; });
canvas.addEventListener("pointercancel", () => { pointer.down = false; });
canvas.addEventListener("pointerleave",  () => { if (!pointer.down) pointer.active = false; });

window.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;  // 不劫持 Ctrl+S 等系统快捷键
  const k = e.key.toLowerCase();
  if (e.code === "Space") {
    e.preventDefault();
    targetIndex = (targetIndex + 1) % PALETTES.length;
    transitioning = true;
  } else if (k === "r") {
    e.preventDefault();
    initParticles();
  } else if (k === "p") {
    e.preventDefault();
    paused = !paused;
    document.getElementById("pause").classList.toggle("on", paused);
    lastTime = performance.now();                 // 避免恢复时 dt 突变
  } else if (k === "s") {
    e.preventDefault();
    savePNG();
  }
});

const slider = document.getElementById("countSlider");
const sliderVal = document.getElementById("sliderVal");
slider.value = String(desired);
slider.addEventListener("input", () => {
  desired = +slider.value;
  sliderVal.textContent = String(desired);
  if (activeCount > desired) activeCount = desired;
});

window.addEventListener("resize", resize);

function savePNG() {
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "particle-light-field-" + Date.now() + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
}

/* ---------------- 7. 物理更新与绘制 ---------------- */
function update(dt) {
  const attract = pointer.active && !pointer.down;
  const repel   = pointer.down;
  const mx = pointer.x, my = pointer.y;
  const damp = Math.pow(CFG.DAMPING, dt);
  const swirlForce = CFG.SWIRL;
  const w = shocks.length;

  for (let i = 0; i < activeCount; i++) {
    let x = px[i], y = py[i], ux = vx[i], uy = vy[i];

    // 鼠标力场：反平方 + 软化 + 范围衰减
    if (attract || repel) {
      const dx = mx - x, dy = my - y;
      const d2 = dx * dx + dy * dy + CFG.SOFT;
      const inv = 1 / Math.sqrt(d2);
      const falloff = 1 / (1 + d2 / CFG.INFLUENCE);
      const strength = repel
        ? CFG.REPEL * falloff
        : CFG.ATTRACT * falloff * (0.6 + 0.4 * pointer.energy);
      const nx = dx * inv, ny = dy * inv;
      ux += ( nx * strength - ny * swirlForce * falloff) * dt;
      uy += ( ny * strength + nx * swirlForce * falloff) * dt;
    }

    // 冲击波：只有处在扩散环带内的粒子受到向外推力
    for (let s = 0; s < w; s++) {
      const wave = shocks[s];
      const dx = x - wave.x, dy = y - wave.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
      const diff = Math.abs(dist - wave.r);
      if (diff < CFG.SHOCK_BAND) {
        const f = (1 - diff / CFG.SHOCK_BAND) * CFG.SHOCK_FORCE * dt / dist;
        ux += dx * f;
        uy += dy * f;
      }
    }

    // 微扰、阻尼、积分
    ux += (rand() - 0.5) * CFG.JITTER * dt;
    uy += (rand() - 0.5) * CFG.JITTER * dt;
    ux *= damp; uy *= damp;
    x += ux * dt; y += uy * dt;

    // 边缘环绕（画的是点精灵，跨屏不会拉出线条）
    const m = HS;
    if (x < -m) x = W + m; else if (x > W + m) x = -m;
    if (y < -m) y = H + m; else if (y > H + m) y = -m;

    px[i] = x; py[i] = y; vx[i] = ux; vy[i] = uy;
  }
}

function render() {
  // 半透明背景覆盖形成拖尾（必须先用 source-over）
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(${cur.bg[0] | 0},${cur.bg[1] | 0},${cur.bg[2] | 0},${CFG.FADE})`;
  ctx.fillRect(0, 0, W, H);

  // 发光叠加模式
  ctx.globalCompositeOperation = "lighter";
  const steps = CFG.SPRITE_STEPS - 1;
  for (let i = 0; i < activeCount; i++) {
    const sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
    let t = sp / CFG.SPEED_REF;
    if (t > 1) t = 1;
    const bucket = (t * steps) | 0;
    const size = 9 + t * 15;
    ctx.globalAlpha = 0.40 + t * 0.50;
    ctx.drawImage(strip, bucket * SS, 0, SS, SS,
                  px[i] - size * 0.5, py[i] - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;

  // 冲击波可视化：两圈叠加的细光环
  const maxR = Math.hypot(W, H) * 1.2;
  for (const wave of shocks) {
    const a = Math.max(0, 1 - wave.r / maxR);
    ctx.strokeStyle = `rgba(${cur.warm[0] | 0},${cur.warm[1] | 0},${cur.warm[2] | 0},${a * 0.45})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a * 0.16})`;
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.r, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

/* ---------------- 8. 帧循环 / FPS / 自适应 / 导出 ---------------- */
const fpsEl   = document.getElementById("fps");
const countEl = document.getElementById("count");
let lastTime = performance.now();
let fpsEMA = 60, workEMA = 4, hudTimer = 0, lastAdjust = 0, bootTime = lastTime;

function adapt(now) {
  if (now - bootTime < 800 || now - lastAdjust < 700) return;  // 启动预热 + 调整冷却
  if (workEMA > 12 && activeCount > CFG.MIN) {                 // 单帧开销过大 → 降粒子数
    activeCount = Math.max(CFG.MIN, Math.floor(activeCount * 0.9));
    lastAdjust = now;
  } else if (workEMA < 7 && activeCount < desired) {            // 有余量 → 缓慢回升
    activeCount = Math.min(desired, activeCount + 25);
    lastAdjust = now;
  }
}

function frame(now) {
  requestAnimationFrame(frame);

  let frameMs = now - lastTime;
  lastTime = now;
  if (frameMs <= 0) frameMs = 16.7;
  fpsEMA += (1000 / frameMs - fpsEMA) * 0.08;

  hudTimer += frameMs;
  if (hudTimer > 200) {
    hudTimer = 0;
    fpsEl.textContent = String(Math.round(fpsEMA));
    countEl.textContent = String(activeCount);
  }

  if (paused) return;

  const dt = Math.max(0.3, Math.min(2, frameMs / 16.6667));  // 归一化到 60fps，并钳制突变
  const t0 = performance.now();

  paletteTick();
  pointer.energy *= Math.pow(0.9, dt);
  updateWaves(dt);
  update(dt);
  render();

  workEMA += ((performance.now() - t0) - workEMA) * 0.08;
  adapt(now);
}

/* ---------------- 启动 ---------------- */
resize();
buildSprites();
initParticles();
requestAnimationFrame(frame);
</script>
</body>
</html>
